<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-shop · Cart</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: #1d2330; background: #f6f7f9; }
  header { height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e3e6eb; }
  header b { font-size: 17px; }
  header nav { display: flex; gap: 16px; color: #5b6475; }
  main { padding: 24px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .row { display: flex; justify-content: space-between; padding: 12px 16px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; }
  .coupon { display: flex; gap: 8px; }
  .coupon input { flex: 1; height: 40px; padding: 0 12px; border: 1px solid #cfd4dc; border-radius: 6px; font: inherit; }
  .coupon button { height: 40px; padding: 0 20px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font: 600 15px/1 inherit; }
  .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
<header><b>web-shop</b><nav><span>Products</span><span>Cart</span><span>Orders</span></nav></header>
<main>
  <h1>Cart</h1>
  <div class="row"><span>Linen shirt</span><span>$48.00</span></div>
  <div class="row"><span>Canvas tote</span><span>$22.00</span></div>
  <form class="coupon" onsubmit="return false"><input placeholder="Coupon code" value="WELCOME"><button data-testid="apply-coupon">Apply coupon</button></form>
  <div class="total"><span>Total</span><span>$65.00</span></div>
</main>
</body>
</html>
