# Typecheck + lint + test + build on macOS and on Windows x64 / arm64 (T19).
# `npm ci` runs the postinstall `electron-rebuild -f -w node-pty`, so node-pty is rebuilt for Electron's ABI on
# each runner's own architecture — a broken native build fails here, not on a user's machine.
name: ci

# Manual only (Actions tab → ci → Run workflow): the macOS job repeats the local `npm run check` and the
# Windows jobs matter only for a Windows release, while each run eats the private repo's free minutes
# (macOS counts 10×, Windows 2×). Run it before a Windows release or after touching native/platform code.
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load node-pty under Electron
        run: npx electron -e "require('node-pty'); process.exit(0)"
        env:
          ELECTRON_RUN_AS_NODE: '1'
      - run: npm run check
        if: runner.os == 'macOS'
      # Many existing tests drive /bin/sh, real repos and fake POSIX binaries; on Windows run the ones written
      # for it until the rest are ported.
      - name: Typecheck, lint, Windows-safe tests
        if: runner.os == 'Windows'
        run: |
          npm run typecheck
          npm run lint
          npx vitest run electron/platform src/shared src/entities
      - run: npm run build
      # Pack the app for this runner's arch and spawn a pty from the packaged layout with the packaged Electron:
      # proves node-pty falls through to its win32 prebuild once build/ is left out (electron-builder.yml → win).
      - name: Package and load node-pty from the installer layout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --win --${{ matrix.arch }} --dir --publish never
          dir=release/win-unpacked; [ -d "$dir" ] || dir=release/win-${{ matrix.arch }}-unpacked
          ELECTRON_RUN_AS_NODE=1 "$dir/Aquila Agents.exe" -e "
            const pty = require(process.argv[1]);
            const p = pty.spawn('cmd.exe', ['/c', 'echo aquila-ok'], {});
            let out = '';
            p.onData((d) => (out += d));
            p.onExit(() => { console.log(out); process.exit(out.includes('aquila-ok') ? 0 : 1); });
            setTimeout(() => { console.error('timeout', out); process.exit(1); }, 20000);
          " "$(pwd)/$dir/resources/app.asar.unpacked/node_modules/node-pty"
