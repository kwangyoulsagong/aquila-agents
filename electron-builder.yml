# `npm run dist` → release/Aquila Agents-<version>-arm64.dmg (+ .zip). Not signed or notarized (T8 → left over).
# `npm run dist` first checks release-notes/<version>.json (T27). Upload the dmg, zip and latest-mac.yml to a GitHub
# release tagged v<version>: the app checks it (electron/updater.ts) and notifies; unsigned builds can't self-install.
appId: dev.aquila.agents
productName: Aquila Agents
copyright: Copyright © 2026 Aquila Agents
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - '!dist/smoke*.png'
  - dist-electron/**
  - '!dist-electron/**/*.test.js'
  - '!dist-electron/electron/tools/**'
  - package.json
# node-pty is native: its .node files and spawn-helper must live outside the asar to load and execute.
asarUnpack:
  - node_modules/node-pty/**
  # The knowledge-graph index worker (T65) is started from a file: keep it (and the modules it requires) on disk.
  - dist-electron/electron/graph/**
  # The lite history worker (T70) requires history.ts and what it imports (config, state, remote, i18n…).
  - dist-electron/electron/*.js
  - dist-electron/electron/remote/**
  - dist-electron/electron/platform/**
  - dist-electron/src/**
# No rebuild at pack time: `postinstall` already rebuilt node-pty for Electron on the host (macOS build), and Windows
# uses node-pty's N-API prebuilds (see win below). Rebuilding here would try to cross-compile and fail.
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
dmg:
  title: Aquila Agents ${version}
# Windows (T20): `npm run dist:win` → release/AquilaAgents-<version>-{x64,arm64}-setup.exe + latest.yml. Unsigned:
# SmartScreen shows "Windows protected your PC" → More info → Run anyway (docs/*/README.md). node-pty is N-API and ships
# prebuilds for win32-x64 and win32-arm64, so both installers are packed from any host: the host's own rebuild
# (build/) is left out and node-pty falls through to prebuilds/win32-<arch>. Signing later: add
# win.azureSignOptions (Artifact Signing) or a certificate; electron/updater.ts then can download + install.
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  files:
    - '!node_modules/node-pty/build/**'
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/**/*.pdb'
# Per-user install, no admin prompt; shortcut AUMID = appId (matches app.setAppUserModelId in electron/main.ts).
nsis:
  oneClick: true
  perMachine: false
  artifactName: AquilaAgents-${version}-${arch}-setup.${ext}
  # One installer per arch (~125 MB each), no combined x64+arm64 one; the updater picks the file named after its arch.
  buildUniversalInstaller: false
  shortcutName: Aquila Agents
  uninstallDisplayName: Aquila Agents
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: kwangyoulsagong
  repo: aquila-agents
  releaseType: release
