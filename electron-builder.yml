# `npm run dist` → release/Aquila Agents-<version>-arm64.dmg (+ .zip). Not signed or notarized (T8 → left over).
# `npm run dist` first checks release-notes/<version>.json (T27). Upload the dmg, zip and latest-mac.yml to a GitHub
# release tagged v<version>: the app checks it (electron/updater.ts) and notifies; unsigned builds can't self-install.
appId: dev.aquila.agents
productName: Aquila Agents
copyright: Copyright © 2026 Aquila Agents
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - '!dist/smoke*.png'
  - dist-electron/**
  - '!dist-electron/**/*.test.js'
  - '!dist-electron/electron/tools/**'
  - package.json
# node-pty is native: its .node files and spawn-helper must live outside the asar to load and execute.
asarUnpack:
  - node_modules/node-pty/**
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
dmg:
  title: Aquila Agents ${version}
publish:
  provider: github
  owner: kwangyoulsagong
  repo: aquila-agents
  releaseType: release
